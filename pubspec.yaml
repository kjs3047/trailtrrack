name: trailtrack
description: "Flutter + CesiumJS workout tracker (Android MVP)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.0

  # Routing
  go_router: ^16.0.0

  # Local database (Drift + SQLite)
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # CesiumJS map WebView
  flutter_inappwebview: ^6.1.5

  # Location / GPS
  geolocator: ^14.0.0

  # Foreground service (Android) for screen-off GPS recording
  flutter_foreground_task: ^9.0.0

  # Runtime permissions
  permission_handler: ^12.0.0

  # Camera & photos
  camera: ^0.11.0
  image: ^4.2.0

  # Charts
  fl_chart: ^1.0.0

  # Google Sign-In + Drive API
  google_sign_in: ^7.0.0
  googleapis: ^14.0.0
  googleapis_auth: ^2.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

  # Backup ZIP (streaming)
  archive: ^4.0.0

  # HTTP (DEM lookups, Drive resumable upload)
  http: ^1.2.0

  # IDs & config
  uuid: ^4.5.0
  flutter_dotenv: ^6.0.0

  # Utilities
  intl: ^0.20.0
  collection: ^1.19.0
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Drift codegen
  drift_dev: ^2.28.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.4

  # Riverpod lints (optional but recommended)
  # custom_lint: ^0.7.0

flutter:
  uses-material-design: true

  # NOTE: The assets/cesium/cesium/** entries are generated by
  # tool/gen_cesium_assets.dart from the vendored Cesium runtime. Flutter's
  # asset system does not recurse into subdirectories, so every Cesium
  # subdirectory must be listed explicitly — this is what prevents the
  # "release build missing Workers/Assets" failure flagged in spec M1.
  # Re-run the generator after updating the Cesium version.
  assets:
    - .env
    - assets/cesium/
    - assets/cesium/cesium/
    - assets/cesium/cesium/Assets/
    - assets/cesium/cesium/Assets/IAU2006_XYS/
    - assets/cesium/cesium/Assets/Images/
    - assets/cesium/cesium/Assets/Textures/
    - assets/cesium/cesium/Assets/Textures/LensFlare/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/0/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/0/0/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/0/1/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/1/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/1/0/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/1/1/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/1/2/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/1/3/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/2/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/2/0/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/2/1/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/2/2/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/2/3/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/2/4/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/2/5/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/2/6/
    - assets/cesium/cesium/Assets/Textures/NaturalEarthII/2/7/
    - assets/cesium/cesium/Assets/Textures/SkyBox/
    - assets/cesium/cesium/Assets/Textures/maki/
    - assets/cesium/cesium/ThirdParty/
    - assets/cesium/cesium/ThirdParty/Workers/
    - assets/cesium/cesium/Widgets/
    - assets/cesium/cesium/Widgets/Animation/
    - assets/cesium/cesium/Widgets/BaseLayerPicker/
    - assets/cesium/cesium/Widgets/Cesium3DTilesInspector/
    - assets/cesium/cesium/Widgets/CesiumInspector/
    - assets/cesium/cesium/Widgets/CesiumWidget/
    - assets/cesium/cesium/Widgets/FullscreenButton/
    - assets/cesium/cesium/Widgets/Geocoder/
    - assets/cesium/cesium/Widgets/I3SBuildingSceneLayerExplorer/
    - assets/cesium/cesium/Widgets/Images/
    - assets/cesium/cesium/Widgets/Images/ImageryProviders/
    - assets/cesium/cesium/Widgets/Images/NavigationHelp/
    - assets/cesium/cesium/Widgets/Images/TerrainProviders/
    - assets/cesium/cesium/Widgets/InfoBox/
    - assets/cesium/cesium/Widgets/NavigationHelpButton/
    - assets/cesium/cesium/Widgets/PerformanceWatchdog/
    - assets/cesium/cesium/Widgets/ProjectionPicker/
    - assets/cesium/cesium/Widgets/SceneModePicker/
    - assets/cesium/cesium/Widgets/SelectionIndicator/
    - assets/cesium/cesium/Widgets/Timeline/
    - assets/cesium/cesium/Widgets/VRButton/
    - assets/cesium/cesium/Widgets/Viewer/
    - assets/cesium/cesium/Widgets/VoxelInspector/
    - assets/cesium/cesium/Workers/

  # Fonts from the Apex Wilderness design system.
  # NOTE: TTF files must be placed under assets/fonts/. See README.
  # If font files are absent the app falls back to the platform default,
  # so the build still succeeds without them.
  # fonts:
  #   - family: Hanken Grotesk
  #     fonts:
  #       - asset: assets/fonts/HankenGrotesk-Regular.ttf
  #       - asset: assets/fonts/HankenGrotesk-Bold.ttf
  #         weight: 700

# App launcher icon (generated by flutter_launcher_icons).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "#154212"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
